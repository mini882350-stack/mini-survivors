<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Mini Survivors</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
 <div id="vig" class="fx"></div><div id="lowhp" class="fx"></div><div id="flash" class="fx"></div><div id="bombfl" class="fx"></div>
 <!-- HUD -->
 <div id="xpbar"><div id="xp" class="fill xp"></div></div>
 <div id="lvbadge"><small>LV</small><b id="lv">1</b></div>
 <div id="topinfo"><span id="kills">☠ 0</span><span id="time">00:00</span><span id="hptxt">❤ 100</span></div>
 <div id="bossbar"><b id="bossname">👑 보스</b><div class="bbar"><div id="bosshp" class="fill"></div></div></div>
 <div id="hpwrap"><div class="hbar"><div id="hp" class="fill hp"></div></div></div>
 <div id="weaponList"></div>
 <div id="toast"></div>
 <div id="skillbar"></div>
 <div id="mbtns"><button id="mPause" aria-label="일시정지">⏸</button><button id="mDash" aria-label="구르기">🌀</button></div>
 <div id="hint">WASD 이동 · 자동 공격 · 1~5 선택 · Space 구르기(레인저) · Esc 메뉴 · Tab 내 스탯 · M 음소거 · F3 FPS</div>
 <!-- 창 -->
 <div id="levelup" class="overlay"><div class="panel"><h2>✨ 능력을 선택하세요</h2><div class="sub">원소가 다른 무기를 모으면 원소 반응이 일어납니다 · 숫자 키로 선택</div><div id="choices" class="choices"></div><div class="btns" style="margin-top:10px"><button id="reroll" style="display:none">🎲 다시 뽑기</button><button id="skipL" class="alt">⏭ 포기하고 다시 뽑기 +1</button></div><div id="ownedL"></div></div></div>
 <div id="chest" class="overlay"><div class="panel"><div class="chestTitle">🎁 보물상자</div><div class="chestSub">하나를 선택하세요.</div><div id="rewards" class="chestReward"></div><div class="btns" style="margin-top:10px"><button id="rerollC" style="display:none">🎲 다시 뽑기</button><button id="skipC" class="alt">⏭ 포기하고 다시 뽑기 +1</button></div><div id="ownedC"></div></div></div>
 <div id="gameover" class="overlay"><div class="panel"><h2>☠️ GAME OVER</h2><div id="result"></div>
  <div class="btns"><button id="cont">∞ 무한 모드로 계속</button><button id="again">🔄 재시작 (R)</button><button id="restart" class="alt">타이틀로</button></div></div></div>
 <div id="title" class="overlay"><div class="panel"></div></div>
 <div id="codeov" class="overlay"><div class="panel"></div></div>
 <div id="notesov" class="overlay"><div class="panel"></div></div>
 <div id="pause" class="overlay"><div class="panel wide"><h2 id="pauseTitle">⏸ 일시정지</h2><div id="ptabs" class="ptabs"></div><div id="pbody"></div>
  <div class="btns"><button id="resume">계속하기</button><button id="againP" class="alt">🔄 재시작 (R)</button><button id="giveup" class="alt">포기하기</button></div></div></div>
</div>

<!-- 로드 순서 중요: core → data → effects → player → enemies → weapons → gun → renderer → hero → ui -->
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/effects.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/weapons.js"></script>
<script src="js/gun.js"></script>
<script src="js/sword.js"></script>
<script src="js/stella.js"></script>
<script src="js/renderer.js"></script>
<script src="js/hero.js"></script>
<script src="js/ui.js"></script>
<script>"use strict";showTitle();maybeNotes();draw();requestAnimationFrame(loop);</script>
</body>
</html>
